# Takaran di satu server: Caddy (HTTPS) -> app Next.js -> Postgres.
# Hanya Caddy yang membuka port ke internet. Postgres dan app hanya bisa
# dijangkau lewat jaringan internal Docker.
#
# Pakai: salin deploy/env.example menjadi .env, isi, lalu
#   docker compose up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN di .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: .
      args:
        APP_URL: https://${DOMAIN}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://takaran:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}@db:5432/takaran
      APP_URL: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?isi BETTER_AUTH_SECRET di .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?isi GOOGLE_CLIENT_ID di .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?isi GOOGLE_CLIENT_SECRET di .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      IP_SALT: ${IP_SALT:?isi IP_SALT di .env}
      MAYAR_API_KEY: ${MAYAR_API_KEY:-}
      MAYAR_BASE_URL: ${MAYAR_BASE_URL:-https://api.mayar.io/hl/v2}
      MAYAR_WEBHOOK_TOKEN: ${MAYAR_WEBHOOK_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takaran
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: takaran
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takaran -d takaran"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cadangan harian ke ./backups. Salin folder itu ke tempat lain (lihat docs/deploy.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: takaran
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: takaran
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?isi BACKUP_PASSPHRASE untuk mengenkripsi cadangan}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null && exec /bin/sh /backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
