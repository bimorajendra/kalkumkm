name = "takaran-api"
main = "src/index.ts"
compatibility_date = "2025-11-06"

[[d1_databases]]
binding = "DB"
database_name = "takaran-orders"
# Replace this local-only placeholder with the ID returned by `wrangler d1 create` before deployment.
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "takaran-local"
migrations_dir = "migrations"

[triggers]
crons = ["0 3 1 * *"]
